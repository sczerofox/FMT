name: ci

on:
  push:
    branches: [main, dev, arch-restart, "feature/**"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# FMT 是 Windows 专用项目：Windows Service（advapi32）、ShellExecuteEx 提权、
# 命名管道安全描述符都无法在 Linux 上构建，因此 CI 只跑 windows-latest。
jobs:
  build:
    name: windows-msvc
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@v4.4.2
        with:
          cmakeVersion: 3.31.x

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test the executable
        shell: pwsh
        run: |
          ./build/bin/fmt.exe --version
          ./build/bin/fmt.exe --help
