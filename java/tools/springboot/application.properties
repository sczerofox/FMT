spring.application.name=mybatis

# ---- 数据库（占位符，换成你自己的；别把真实口令提交进版本库）----
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/lazy?useUnicode=true&characterEncoding=utf-8
spring.datasource.username=root
spring.datasource.password=your-password

mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath*:mapper/*.xml

# ---- FMT 通道（org.lazy:fmt-spring-boot-starter 自动配置）----
fmt.enabled=true
# 必须写主机名 localhost：FMT 默认 host=localhost，Windows 上常只绑 IPv6 的 ::1，
# SDK 靠主机名的多地址候选做回落（写死字面 IP 就没这层保护了）
fmt.base-url=http://localhost:4122
# token 从 <data-root>/data/user.json 读：服务端换 token / 重装服务后 Java 侧不用改配置
# （改成你自己的数据根；也可以改用 fmt.token=<32 位十六进制>，那样 token 轮换就要改配置）
fmt.data-root=D:/Tools/fmt

# 方式 A：账号 + 密码 + 库名（2.1.0 起，像 MySQL；与上面的 token/data-root 二选一）
# fmt.username=user
# fmt.password=your-password
# fmt.bucket=work
fmt.auth-scheme=X_FMT_TOKEN
fmt.connect-timeout=3s
fmt.request-timeout=30s
fmt.stream-timeout=30m
fmt.max-connections=16
fmt.retry-on-unauthorized=true
fmt.idempotent-retries=0

logging.level.org.lazy.fmt.client=INFO

# 健康检查详情：不写这行 /actuator/health 只回 {"status":"UP"}，
# 看不到 fmt 那段的 baseUrl / authenticated / root / version / pid
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always